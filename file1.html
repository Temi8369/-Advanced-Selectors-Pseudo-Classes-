<html>

<head>

    <title>My food menu</title>

    <style>
        body{
            font-family: Arial;
            background-color: chocolate;
            padding: 30px;
            text-align: center;
        }
        h1{
            color: chartreuse;
        }
        h1 + p {
            background-color: chartreuse;
            padding: 10px 20px ;
            border-radius: 8px ;
            color: darkcyan;
            display: inline-block;
        }
        ul {
            margin-top: 20px;
        }
        ul > li {
            color: chocolate;
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background-color: yellow;
            border-radius: 8px;
        }
        ul li:nth-child(1) {
            background-color: gold;
            color:blueviolet
        }
        .desc {
            color: orangered;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .desc::first-letter {
            font-size: 220%;
            color: hotpink;
            font-weight: bold;
        }
        .links {margin-top: 25px;}
        a {
            color:darkmagenta;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid rgb(6, 80, 6);
            border-radius: 8px;
        }
        a:hover {
            background-color: lavender;
            color:black;
        }
    </style>

</head>

<body>

    <h1>My food menu</h1>
    <p>pick your favourite dish and dig in</p>

    <ul>

        <li>pizza-chefs special</li>
        <li>burger</li>
        <li>tacos</li>
        <li>noodles</li>
        <li>icecream</li>
        
    </ul>

    <p class="desc">Every dish on this menu is 
        made with love and loads of flavour.
          Try them all and find your favourite!
           We hope you enjoy!</p>

          <div class="links">

            <a href="#">Order now</a>
            <a href="#">See more</a>

          </div>

</body>

</html>
